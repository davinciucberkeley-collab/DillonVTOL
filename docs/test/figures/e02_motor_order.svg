<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 780 778' width='780' height='778' role='img'><title>E02 motor order: top view of C0 to scale with lift motors M1-M4, spin directions, pusher and servo outputs (vtol_c0.param §2; cad/params.txt)</title><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#1f2328'/></marker><marker id='arrB' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#2f6fdb'/></marker><marker id='arrO' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#d9771e'/></marker><marker id='arrM' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#57606a'/></marker><marker id='arrR' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#ad2a1f'/></marker></defs><rect width='100%' height='100%' fill='#ffffff'/><text x='24.0' y='30.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#1f2328' text-anchor='start' font-weight='600'>E02 · ESC protocol, motor order, direction and spin thresholds</text><text x='24.0' y='52.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#57606a' text-anchor='start' font-weight='400'>Props off. Mission Planner motor test in the ArduPilot Quad X order at the 10 % command; set direction with DShot</text><text x='24.0' y='70.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#57606a' text-anchor='start' font-weight='400'>comman