om cad/params.txt (xFront, xRear, yIn, liftProp,</text><text x='24.0' y='700.6' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#57606a' text-anchor='start' font-weight='400'>fusL 0.85 m pod, comp= records; x from the wing LE, forward +); elevator chord split schematic.</text><line x1='24.0' y1='730.6' x2='756.0' y2='730.6' stroke='#d0d7de' stroke-width='1'/><text x='24.0' y='750.6' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='start' font-weight='400'>Pass (test-matrix.csv): correct order/direction; SPIN_ARM ≥ measured + 0.02; no desync at 100 % 3 s props off</text></svg>
