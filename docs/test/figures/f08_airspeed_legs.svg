ocal passes A and B at 60 m</text><text x='508.0' y='258.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='start' font-weight='400'>AGL in CRUISE, each ≥ 15 s steady, repeated</text><text x='508.0' y='274.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='start' font-weight='400'>until each heading has ≥ 60 s: cruise (18</text><text x='508.0' y='290.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='start' font-weight='400'>m/s), then 20 m/s, then 22 m/s.</text><circle cx='490.0' cy='310.0' r='9.5' fill='#ffffff' stroke='#d9771e' stroke-width='2'/><text x='490.0' y='314.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#1f2328' text-anchor='middle' font-weight='700'>3</text><text x='508.0' y='314.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='start' font-weight='400'>Back-transition, QLAND.</text><text x='480.0' y='346.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='start' font-weight='600'>Leg length check (calc)</text><text x='480.0' y='366.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#57606a' text-anchor='start' font-weight='400'>A 60 s leg at 18 m/s is 18 × 60 = 1,080 m; the</text><text x='480.0' y='382.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#57606a' text-anchor='start' font-weight='400'>straights inside the 250 m abort ring are shorter,</text><text x='480.0' y='398.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#57606a' text-anchor='start' font-weight='400'>so the card asks for ≥ 15 s passes ({VC * 15:,.0f}</text><text x='480.0' y='414.0' font-family='IBM Plex 