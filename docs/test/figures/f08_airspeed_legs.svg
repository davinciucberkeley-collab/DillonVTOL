 Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#57606a' text-anchor='start' font-weight='400'>land</text><text x='94.0' y='920.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#57606a' text-anchor='start' font-weight='400'>Each speed: reciprocal pair A/B, 60 s each, at 60 m AGL; record BAT current and volts, throttle, GPS speed per leg.</text><text x='94.0' y='938.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#57606a' text-anchor='start' font-weight='400'>Abort (card): ratio outside 1.5–3.0 in flight 1; cruise current &gt; 22 A sustained EST; within 50 m of the fence.</text><line x1='24.0' y1='976.0' x2='756.0' y2='976.0' stroke='#d0d7de' stroke-width='1'/><text x='24.0' y='996.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='start' font-weight='400'>Pass (test-matrix.csv): ratio 1.5-3.0; airspeed vs GPS error ≤ 10 %; cruise power ≤ 414 W / 18.6 A (calc R10); pusher can</text><text x='24.0' y='1014.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='start' font-weight='400'>≤ 80 °C EST by IR after the legs</text><text x='24.0' y='1034.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#57606a' text-anchor='start' font-weight='400'>Pairs at cruise (18 m/s) first (AIRSPEED_CRUISE 18), then 20 and 22 m/s. The 414 W / 18.6 A power line is the R10 threshold as the</text><text x='24.0' y='1050.0' font-family='IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#57606a' text-anchor='start' font-weight='400'>matrix states it.</text></svg>
